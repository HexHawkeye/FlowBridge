name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore FlowBridge.slnx
      - run: dotnet build FlowBridge.slnx -c Release --no-restore
      - run: dotnet test FlowBridge.Tests/FlowBridge.Tests.csproj -c Release --no-build
      - run: docker build -t flowbridge:test .
